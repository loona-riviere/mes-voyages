<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voyages" />
    <meta name="theme-color" content="#EEF0EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141814" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mes voyages</title>
    <script>
      // Écran de lancement : seulement depuis l'icône (ou avec ?splash=1 pour le prévisualiser).
      (function () {
        var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
        if (standalone || /[?&]splash=1\b/.test(location.search)) {
          document.documentElement.classList.add("splash-en-cours");
          window.__splashStart = Date.now();
        }
      })();
    </script>
    <style>
      #splash { display: none; }
      html.splash-en-cours, html.splash-en-cours body { background: #1D2620; }
      html.splash-en-cours body > :not(#splash) { visibility: hidden; }
      html.splash-en-cours #splash { display: block; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #1D2620;
        transition: opacity .4s ease; -webkit-user-select: none; user-select: none;
      }
      #splash.sortie { opacity: 0; pointer-events: none; }
      .sp-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #F6D9A4 0%, #F1BC8A 38%, #E89C6A 58%, #9C6FA8 78%); }
      .sp-sun {
        position: absolute; left: 50%; bottom: 24%; width: 46vmin; height: 46vmin; margin-left: -23vmin; border-radius: 50%;
        background: radial-gradient(circle, #FFF8E8 0 58%, rgba(255, 248, 232, .35) 60%, rgba(255, 248, 232, 0) 72%);
        animation: sp-sun 2.4s cubic-bezier(.2, .7, .2, 1) both;
      }
      .sp-hill { position: absolute; left: -10%; right: -10%; bottom: 0; }
      .sp-hill svg { display: block; width: 100%; height: 100%; }
      .sp-hill.back { height: 34%; animation: sp-rise 1.4s .1s cubic-bezier(.2, .7, .2, 1) both, sp-drift 9s 1.5s ease-in-out infinite alternate; }
      .sp-hill.front { height: 22%; animation: sp-rise 1.2s cubic-bezier(.2, .7, .2, 1) both; }
      .sp-brand {
        position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 22%);
        display: grid; justify-items: center; gap: 10px; text-align: center; color: #1D2620;
        animation: sp-brand .7s .25s cubic-bezier(.2, .7, .2, 1) both;
      }
      .sp-logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px -12px rgba(60, 30, 40, .55); }
      .sp-name { font: 400 40px/1 "Young Serif", Georgia, serif; margin-top: 8px; }
      .sp-tag { font: 600 15px/1.3 "Figtree", system-ui, sans-serif; opacity: .72; }
      .sp-orbit {
        position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 22% + 42px);
        width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%;
        border: 1.5px dashed rgba(29, 38, 32, .28); animation: sp-spin 5s linear infinite, sp-fade .6s .3s both;
      }
      .sp-plane { position: absolute; left: 50%; top: -12px; width: 24px; height: 24px; margin-left: -12px; transform: rotate(90deg); }
      .sp-names {
        position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 7%);
        overflow: hidden; animation: sp-fade .6s .6s both;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
                mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      }
      .sp-row { display: flex; gap: 28px; width: max-content; animation: sp-scroll 14s linear infinite; }
      .sp-row span { font: 400 20px "Young Serif", Georgia, serif; color: #EEF0EA; opacity: .9; white-space: nowrap; }
      .sp-row span::after { content: "·"; margin-left: 28px; opacity: .5; }
      @keyframes sp-sun { from { transform: translateY(40%) scale(.92); opacity: .3; } }
      @keyframes sp-rise { from { transform: translateY(35%); } }
      @keyframes sp-drift { to { transform: translateX(-4%); } }
      @keyframes sp-brand { from { opacity: 0; transform: translateY(16px) scale(.97); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @keyframes sp-scroll { to { transform: translateX(-50%); } }
      @media (prefers-color-scheme: dark) {
        .sp-sky { background: linear-gradient(180deg, #2B2A4A 0%, #5A4470 40%, #A86E78 62%, #D99A6A 80%); }
        .sp-brand { color: #F4EEE6; }
        .sp-orbit { border-color: rgba(244, 238, 230, .3); }
        .sp-plane path { fill: #F4EEE6; }
      }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-sky"></div>
      <div class="sp-sun"></div>
      <div class="sp-hill back"><svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 30 C 80 0, 150 50, 230 24 S 360 6, 400 22 V 100 H 0 Z" fill="#3846B0"/></svg></div>
      <div class="sp-hill front"><svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 26 C 90 4, 180 44, 270 20 S 370 8, 400 18 V 100 H 0 Z" fill="#1D2620"/></svg></div>
      <div class="sp-orbit"><svg class="sp-plane" viewBox="0 0 24 24"><path fill="#1D2620" d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg></div>
      <div class="sp-brand">
        <img class="sp-logo" src="/icon.svg" alt="" />
        <div class="sp-name">Mes voyages</div>
        <div class="sp-tag">Où partir ensuite ?</div>
      </div>
      <div class="sp-names"><div class="sp-row" id="splashNames"></div></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("splash");
        if (!document.documentElement.classList.contains("splash-en-cours")) { el.remove(); return; }
        // Les envies Notion gardées en cache, sinon quelques idées du catalogue.
        var names = [];
        try { names = (JSON.parse(localStorage.getItem("mv-cache-v1") || "{}").wishes || []).map(function (w) { return w.name; }); } catch (e) {}
        if (names.length < 4) names = names.concat(["Namibie", "Islande", "Japon", "Açores", "Patagonie", "Ouzbékistan", "Madère", "Laponie"]);
        var row = document.getElementById("splashNames");
        names.slice(0, 10).concat(names.slice(0, 10)).forEach(function (n) {
          var s = document.createElement("span"); s.textContent = n; row.appendChild(s);
        });
        // Filet de sécurité : si l'appli ne démarre pas, on retire l'écran quand même.
        setTimeout(function () {
          document.documentElement.classList.remove("splash-en-cours");
          if (el.isConnected) el.remove();
        }, 4500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
